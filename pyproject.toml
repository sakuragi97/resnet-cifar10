[project]
name = "resnet-cifar10"
version = "0.1.0"
description = "A clean, minimal PyTorch implementation of ResNet for CIFAR-10 (He et al., 2015)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Yasser EL BACHIRI" }]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

# CUDA 12.8 wheels on Linux/Windows, default PyPI wheels (CPU/MPS) on macOS.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
